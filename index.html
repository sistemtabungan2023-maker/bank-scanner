<!doctype html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#07111f"
>

<title>Bank Scanner</title>

<!-- TABLER ICONS -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
>

<!-- HTML5 QR CODE -->
<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#07111f;
  color:#fff;
}

body{
  min-height:100vh;
  min-height:100dvh;
}


/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100%;

  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  background:#07111f;
}


/* =========================================================
   HEADER
========================================================= */

.header{

  height:56px;

  flex:0 0 56px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0
    14px;

  background:
    rgba(
      7,
      17,
      31,
      .94
    );

  border-bottom:
    1px
    solid
    rgba(
      255,
      255,
      255,
      .08
    );
}

.header-left{

  display:flex;

  align-items:center;

  gap:9px;
}

.header-icon{

  width:34px;
  height:34px;

  border-radius:9px;

  display:grid;

  place-items:center;

  background:#155eef;

  font-size:18px;
}

.header-title{

  font-size:12px;

  font-weight:700;

  letter-spacing:.04em;
}

.header-subtitle{

  margin-top:1px;

  font-size:8px;

  color:
    rgba(
      255,
      255,
      255,
      .48
    );
}

.header-status{

  display:flex;

  align-items:center;

  gap:5px;

  font-size:8px;

  color:
    rgba(
      255,
      255,
      255,
      .55
    );
}

.status-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0
    0
    10px
    rgba(
      34,
      197,
      94,
      .8
    );
}


/* =========================================================
   MAIN
========================================================= */

.main{

  flex:1;

  min-height:0;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:12px;

  overflow:hidden;
}

.scanner{

  width:
    min(
      500px,
      100%
    );

  max-height:100%;

  display:flex;

  flex-direction:column;

  gap:9px;

  min-height:0;
}


/* =========================================================
   TITLE
========================================================= */

.title{

  text-align:center;

  flex:0 0 auto;
}

.title h1{

  margin:0;

  font-size:18px;

  line-height:1.2;
}

.title p{

  margin:
    4px
    0
    0;

  font-size:9px;

  color:
    rgba(
      255,
      255,
      255,
      .48
    );
}


/* =========================================================
   CAMERA
========================================================= */

.camera{

  position:relative;

  width:100%;

  height:
    min(
      500px,
      calc(
        100vh - 205px
      )
    );

  min-height:300px;

  background:#000;

  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0
    18px
    45px
    rgba(
      0,
      0,
      0,
      .30
    );
}


/* QR library */
#reader{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  z-index:1;

  background:#000;
}

#reader video{

  width:100%!important;

  height:100%!important;

  object-fit:cover!important;

  display:block!important;
}

#reader__dashboard{
  display:none!important;
}

#reader__dashboard_section_swaplink{
  display:none!important;
}

#reader__scan_region{

  width:100%!important;

  height:100%!important;

  background:#000!important;

  border:0!important;
}

#reader__scan_region img{
  display:none!important;
}


/* =========================================================
   OVERLAY
========================================================= */

.camera-shade{

  position:absolute;

  inset:0;

  z-index:5;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.30),
      transparent 25%,
      transparent 72%,
      rgba(0,0,0,.38)
    );
}


/* =========================================================
   SCAN BOX
========================================================= */

.scan-box{

  position:absolute;

  left:15%;
  right:15%;

  top:20%;
  bottom:23%;

  z-index:10;

  border:
    2px
    solid
    rgba(
      255,
      255,
      255,
      .95
    );

  border-radius:18px;

  box-shadow:
    0
    0
    0
    9999px
    rgba(
      0,
      0,
      0,
      .18
    );

  pointer-events:none;
}


/* =========================================================
   CORNERS
========================================================= */

.corner{

  position:absolute;

  width:30px;
  height:30px;

}

.corner.tl{

  left:-2px;
  top:-2px;

  border-left:
    4px
    solid
    #fff;

  border-top:
    4px
    solid
    #fff;

  border-radius:
    10px
    0
    0
    0;
}

.corner.tr{

  right:-2px;
  top:-2px;

  border-right:
    4px
    solid
    #fff;

  border-top:
    4px
    solid
    #fff;

  border-radius:
    0
    10px
    0
    0;
}

.corner.bl{

  left:-2px;
  bottom:-2px;

  border-left:
    4px
    solid
    #fff;

  border-bottom:
    4px
    solid
    #fff;

  border-radius:
    0
    0
    0
    10px;
}

.corner.br{

  right:-2px;
  bottom:-2px;

  border-right:
    4px
    solid
    #fff;

  border-bottom:
    4px
    solid
    #fff;

  border-radius:
    0
    0
    10px
    0;
}


/* =========================================================
   SCAN LINE
========================================================= */

.scan-line{

  position:absolute;

  left:15%;
  right:15%;

  top:50%;

  z-index:11;

  height:2px;

  border-radius:99px;

  background:#3b82f6;

  box-shadow:
    0
    0
    8px
    rgba(
      59,
      130,
      246,
      .9
    );

  animation:
    scanMove
    2.2s
    ease-in-out
    infinite;

  pointer-events:none;
}

@keyframes scanMove{

  0%,
  100%{
    transform:
      translateY(-80px);
  }

  50%{
    transform:
      translateY(80px);
  }

}


/* =========================================================
   IDLE
========================================================= */

.idle{

  position:absolute;

  inset:0;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    rgba(
      7,
      17,
      31,
      .86
    );
}

.idle-content{

  text-align:center;

  padding:20px;
}

.idle-icon{

  width:54px;
  height:54px;

  margin:
    0
    auto
    10px;

  border-radius:15px;

  display:grid;

  place-items:center;

  background:
    rgba(
      255,
      255,
      255,
      .08
    );

  font-size:24px;
}

.idle-content strong{

  display:block;

  font-size:14px;
}

.idle-content span{

  display:block;

  margin-top:5px;

  font-size:9px;

  line-height:1.5;

  color:
    rgba(
      255,
      255,
      255,
      .48
    );
}


/* =========================================================
   STATUS
========================================================= */

.status{

  min-height:38px;

  flex:0 0 auto;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:6px;

  padding:
    7px
    10px;

  border-radius:10px;

  background:
    rgba(
      255,
      255,
      255,
      .06
    );

  border:
    1px
    solid
    rgba(
      255,
      255,
      255,
      .07
    );

  font-size:9px;

  text-align:center;
}

.status i{
  font-size:15px;
}

.status.error{

  background:
    rgba(
      127,
      29,
      29,
      .32
    );

  color:#fecaca;
}

.status.success{

  background:
    rgba(
      20,
      83,
      45,
      .32
    );

  color:#bbf7d0;
}


/* =========================================================
   BUTTONS
========================================================= */

.actions{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:7px;
}

button{

  min-height:42px;

  border:0;

  border-radius:10px;

  padding:
    8px
    11px;

  font-size:9px;

  font-weight:700;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:6px;
}

button i{
  font-size:16px;
}

button:disabled{

  opacity:.45;

  cursor:not-allowed;
}

.btn-primary{

  background:#155eef;

  color:#fff;
}

.btn-secondary{

  background:#fff;

  color:#182033;
}

.btn-danger{

  background:#991b1b;

  color:#fff;
}


/* =========================================================
   RESULT
========================================================= */

.result{

  display:none;

  padding:11px;

  border-radius:12px;

  background:#fff;

  color:#182033;
}

.result.show{

  display:block;
}

.result-label{

  font-size:7px;

  letter-spacing:.12em;

  color:#7c8798;

  font-weight:700;
}

.result-value{

  margin-top:4px;

  font-size:18px;

  font-weight:700;

  word-break:break-all;
}

.result-actions{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:6px;

  margin-top:8px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  text-align:center;

  font-size:7px;

  color:
    rgba(
      255,
      255,
      255,
      .28
    );

  flex:0 0 auto;
}


/* =========================================================
   EMBEDDED MODE
========================================================= */

body.embedded .header{
  display:none!important;
}

body.embedded .main{

  padding:0;

  height:100%;
  min-height:100dvh;
}

body.embedded .scanner{

  width:100%;
  height:100%;

  max-width:none;
  max-height:none;

  gap:0;
}

body.embedded .title,
body.embedded .footer{
  display:none!important;
}

body.embedded .camera{

  width:100%;
  height:100%;

  min-height:100dvh;

  border-radius:0;
}

body.embedded .status{

  position:absolute;

  left:9px;
  right:9px;

  bottom:112px;

  z-index:30;

  background:
    rgba(
      7,
      17,
      31,
      .78
    );

  backdrop-filter:blur(8px);
}

body.embedded .actions{

  position:absolute;

  left:9px;
  right:9px;

  bottom:9px;

  z-index:40;
}

body.embedded .result{

  position:absolute;

  left:10px;
  right:10px;

  top:50%;

  transform:
    translateY(-50%);

  z-index:50;

  box-shadow:
    0
    18px
    50px
    rgba(
      0,
      0,
      0,
      .40
    );
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .header{

    height:52px;

    flex-basis:52px;

    padding:
      0
      10px;
  }

  .header-icon{

    width:31px;
    height:31px;

    font-size:16px;
  }

  .header-title{
    font-size:11px;
  }

  .header-subtitle{
    font-size:7px;
  }

  .main{
    padding:7px;
  }

  .scanner{
    width:100%;
  }

  .title h1{
    font-size:17px;
  }

  .title p{
    font-size:8px;
  }

  .camera{

    height:
      min(
        480px,
        calc(
          100dvh - 190px
        )
      );

    min-height:280px;

    border-radius:15px;
  }

  .scan-box{

    left:12%;
    right:12%;

    top:18%;
    bottom:23%;

  }

  .scan-line{

    left:12%;
    right:12%;

  }

  .corner{

    width:27px;
    height:27px;

  }

  .status{
    min-height:36px;
    font-size:8px;
  }

  button{
    min-height:40px;
    font-size:8px;
  }

}


/* =========================================================
   MOBILE EMBEDDED
========================================================= */

@media(max-width:600px){

  body.embedded .scan-box{

    left:13%;
    right:13%;

    top:23%;
    bottom:30%;

  }

  body.embedded .scan-line{

    left:13%;
    right:13%;

  }

  body.embedded .status{

    left:7px;
    right:7px;

    bottom:104px;

  }

  body.embedded .actions{

    left:7px;
    right:7px;

    bottom:7px;

    gap:5px;

  }

  body.embedded .actions button{

    min-height:43px;

  }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:380px){

  .camera{

    height:
      calc(
        100dvh - 185px
      );

  }

  body.embedded .scan-box{

    top:22%;
    bottom:31%;

  }

}

</style>

</head>


<body>

<div class="app">


  <!-- HEADER -->
  <header class="header">

    <div class="header-left">

      <div class="header-icon">
        <i class="ti ti-qrcode"></i>
      </div>

      <div>

        <div class="header-title">
          BANK SCANNER
        </div>

        <div class="header-subtitle">
          Live QR Account Scanner
        </div>

      </div>

    </div>


    <div class="header-status">

      <span class="status-dot"></span>

      <span>
        LIVE
      </span>

    </div>

  </header>


  <!-- MAIN -->
  <main class="main">

    <section class="scanner">


      <!-- TITLE -->
      <div class="title">

        <h1>
          Scan QR Rekening
        </h1>

        <p>
          Arahkan QR rekening ke kotak scan.
        </p>

      </div>


      <!-- CAMERA -->
      <div class="camera">

        <div id="reader"></div>


        <div
          id="idle"
          class="idle"
        >

          <div class="idle-content">

            <div class="idle-icon">

              <i class="ti ti-camera"></i>

            </div>

            <strong>
              Scanner Siap
            </strong>

            <span>
              Tekan tombol Mulai Scanner
              untuk membuka kamera.
            </span>

          </div>

        </div>


        <div class="camera-shade"></div>


        <div class="scan-box">

          <div class="corner tl"></div>

          <div class="corner tr"></div>

          <div class="corner bl"></div>

          <div class="corner br"></div>

        </div>


        <div class="scan-line"></div>

      </div>


      <!-- STATUS -->
      <div
        id="status"
        class="status"
      >

        <i class="ti ti-camera-off"></i>

        <span>
          Scanner belum aktif.
        </span>

      </div>


      <!-- BUTTON BARIS 1 -->
      <div class="actions">

        <button
          id="startButton"
          class="btn-primary"
          type="button"
        >

          <i class="ti ti-camera"></i>

          Mulai Scanner

        </button>


        <button
          id="switchButton"
          class="btn-secondary"
          type="button"
        >

          <i class="ti ti-switch-2"></i>

          Ganti Kamera

        </button>

      </div>


      <!-- BUTTON BARIS 2 -->
      <div class="actions">

        <button
          id="stopButton"
          class="btn-danger"
          type="button"
        >

          <i class="ti ti-camera-off"></i>

          Tutup Scanner

        </button>


        <button
          id="retryButton"
          class="btn-secondary"
          type="button"
        >

          <i class="ti ti-refresh"></i>

          Coba Lagi

        </button>

      </div>


      <!-- RESULT -->
      <div
        id="result"
        class="result"
      >

        <div class="result-label">

        </div>


        <div
          id="resultValue"
          class="result-value"
        >
          -
        </div>


        <div class="result-actions">

          <button
            id="copyButton"
            class="btn-primary"
            type="button"
          >

            <i class="ti ti-copy"></i>

            Salin

          </button>


          <button
            id="scanAgainButton"
            class="btn-secondary"
            type="button"
          >

            <i class="ti ti-scan"></i>

            Scan Lagi

          </button>

        </div>

      </div>


      <div class="footer">

        BANK NASABAH • QR Scanner HTTPS

      </div>


    </section>

  </main>

</div>


<script>

(function(){

'use strict';


/* =========================================================
   EMBEDDED
========================================================= */

var params =
  new URLSearchParams(
    window.location.search
  );

var embedded =
  params.get('embedded') === '1';

if(embedded){

  document.body.classList.add(
    'embedded'
  );

}


/* =========================================================
   ELEMENT
========================================================= */

var reader =
  document.getElementById(
    'reader'
  );

var idle =
  document.getElementById(
    'idle'
  );

var statusBox =
  document.getElementById(
    'status'
  );

var startButton =
  document.getElementById(
    'startButton'
  );

var switchButton =
  document.getElementById(
    'switchButton'
  );

var stopButton =
  document.getElementById(
    'stopButton'
  );

var retryButton =
  document.getElementById(
    'retryButton'
  );

var result =
  document.getElementById(
    'result'
  );

var resultValue =
  document.getElementById(
    'resultValue'
  );

var copyButton =
  document.getElementById(
    'copyButton'
  );

var scanAgainButton =
  document.getElementById(
    'scanAgainButton'
  );


/* =========================================================
   STATE
========================================================= */

var scanner = null;

var running = false;

var starting = false;

var cameras = [];

var cameraIndex = 0;

var lastAccount = '';

var lastTime = 0;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  type,
  icon
){

  var span =
    statusBox.querySelector(
      'span'
    );

  var i =
    statusBox.querySelector(
      'i'
    );

  span.textContent =
    text;

  i.className =
    'ti '+
    (
      icon ||
      'ti-info-circle'
    );

  statusBox.className =
    'status';

  if(type){

    statusBox.classList.add(
      type
    );

  }

}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons(){

  startButton.disabled =
    running ||
    starting;

  stopButton.disabled =
    !running;

  switchButton.disabled =
    starting;

  retryButton.disabled =
    starting;

}


/* =========================================================
   ACCOUNT PARSER
========================================================= */

function parseAccount(
  raw
){

  var value =
    String(
      raw || ''
    ).trim();


  var parts =
    value.split('|');


  if(
    parts.length >= 3 &&
    (
      parts[0] ===
        'BANKNASABAH' ||
      parts[0] ===
        'BANKAPP'
    ) &&
    parts[1] ===
      'REK'
  ){

    value =
      parts[2].trim();

  }


  value =
    value.replace(
      /[^\d]/g,
      ''
    );


  if(
    /^\d+$/.test(
      value
    )
  ){

    return value;

  }


  return '';

}


/* =========================================================
   SEND MESSAGE TO MAIN APP
========================================================= */

function sendResult(
  account
){

  var message = {

    type:
      'BANK_SCANNER_RESULT',

    account:
      account,

    value:
      account

  };


  try{

    if(
      window.parent &&
      window.parent !== window
    ){

      window.parent.postMessage(
        message,
        '*'
      );

    }

  }catch(_){}


  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(
        message,
        '*'
      );

    }

  }catch(_){}


  try{

    if(
      'BroadcastChannel'
      in window
    ){

      var channel =
        new BroadcastChannel(
          'BANK_NASABAH_SCANNER'
        );

      channel.postMessage(
        message
      );

      channel.close();

    }

  }catch(_){}

}


/* =========================================================
   HANDLE RESULT
========================================================= */

async function handleResult(
  decodedText
){

  var account =
    parseAccount(
      decodedText
    );


  if(!account){

    setStatus(
      'QR terbaca tetapi bukan QR rekening Bank Nasabah.',
      'error',
      'ti-alert-triangle'
    );

    return;

  }


  var now =
    Date.now();


  if(
    account ===
      lastAccount &&
    now-lastTime <
      2500
  ){

    return;

  }


  lastAccount =
    account;

  lastTime =
    now;


  resultValue.textContent =
    account;

  result.classList.add(
    'show'
  );


  setStatus(
    'QR berhasil dibaca.',
    'success',
    'ti-circle-check'
  );


  sendResult(
    account
  );


  await stopScanner();


  updateButtons();

}


/* =========================================================
   GET CAMERAS
========================================================= */

async function getCameras(){

  try{

    cameras =
      (
        await navigator
          .mediaDevices
          .enumerateDevices()
      )
      .filter(
        function(device){

          return device.kind ===
            'videoinput';

        }
      );

  }catch(_){

    cameras = [];

  }

}


function selectRearCamera(){

  var index =
    cameras.findIndex(
      function(camera){

        return /back|rear|environment/i
          .test(
            camera.label || ''
          );

      }
    );


  if(index >= 0){

    cameraIndex =
      index;

  }

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner(){

  if(
    starting ||
    running
  ){

    return;

  }


  if(
    typeof Html5Qrcode ===
      'undefined'
  ){

    setStatus(
      'Library scanner belum dimuat. Muat ulang halaman.',
      'error',
      'ti-alert-circle'
    );

    return;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    setStatus(
      'Browser tidak mendukung kamera live.',
      'error',
      'ti-device-camera-off'
    );

    return;

  }


  if(
    location.protocol !==
      'https:' &&
    location.hostname !==
      'localhost' &&
    location.hostname !==
      '127.0.0.1'
  ){

    setStatus(
      'Scanner harus dibuka melalui HTTPS.',
      'error',
      'ti-lock'
    );

    return;

  }


  starting =
    true;

  updateButtons();


  setStatus(
    'Meminta izin kamera...',
    null,
    'ti-loader-2'
  );


  try{

    /*
     * Minta permission.
     */
    var permissionStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:
                'environment'
            }
          },

          audio:false

        });


    permissionStream
      .getTracks()
      .forEach(
        function(track){

          try{
            track.stop();
          }catch(_){}

        }
      );


    await getCameras();


    selectRearCamera();


    if(scanner){

      try{
        await scanner.stop();
      }catch(_){}

      try{
        await scanner.clear();
      }catch(_){}

    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    var cameraId;


    if(
      cameras[cameraIndex] &&
      cameras[cameraIndex].deviceId
    ){

      cameraId =
        cameras[
          cameraIndex
        ].deviceId;

    }else{

      cameraId = {

        facingMode:
          {
            ideal:
              'environment'
          }

      };

    }


    idle.classList.add(
      'hidden'
    );


    var size =
      Math.max(
        170,
        Math.min(
          280,
          Math.floor(
            window.innerWidth *
            .58
          )
        )
      );


    await scanner.start(

      cameraId,

      {

        fps:10,

        qrbox:{
          width:size,
          height:size
        },

        aspectRatio:1,

        disableFlip:false

      },

      function(decodedText){

        handleResult(
          decodedText
        );

      },

      function(){

        /*
         * Decode error normal.
         */

      }

    );


    running =
      true;

    starting =
      false;


    setStatus(
      'Kamera LIVE. Arahkan QR ke kotak.',
      null,
      'ti-camera'
    );


    updateButtons();


  }catch(error){

    console.error(
      error
    );


    running =
      false;

    starting =
      false;


    if(scanner){

      try{
        await scanner.stop();
      }catch(_){}

      try{
        await scanner.clear();
      }catch(_){}

    }


    scanner =
      null;


    idle.classList.remove(
      'hidden'
    );


    var name =
      error &&
      error.name
        ? error.name
        : '';


    if(
      name ===
        'NotAllowedError' ||
      name ===
        'PermissionDeniedError'
    ){

      setStatus(
        'Kamera diblokir browser. Izinkan kamera untuk situs ini.',
        'error',
        'ti-camera-off'
      );

    }else if(
      name ===
        'NotFoundError'
    ){

      setStatus(
        'Kamera tidak ditemukan.',
        'error',
        'ti-device-camera-off'
      );

    }else if(
      name ===
        'NotReadableError'
    ){

      setStatus(
        'Kamera sedang digunakan aplikasi lain.',
        'error',
        'ti-camera-off'
      );

    }else{

      setStatus(
        error &&
        error.message
          ? error.message
          : 'Scanner gagal dibuka.',
        'error',
        'ti-alert-circle'
      );

    }


    updateButtons();

  }

}


/* =========================================================
   STOP
========================================================= */

async function stopScanner(){

  running =
    false;


  if(scanner){

    try{

      await scanner.stop();

    }catch(_){}


    try{

      await scanner.clear();

    }catch(_){}

  }


  scanner =
    null;


  idle.classList.remove(
    'hidden'
  );


  updateButtons();

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera(){

  await getCameras();


  if(
    cameras.length <
      2
  ){

    setStatus(
      'Perangkat hanya memiliki satu kamera.',
      'error',
      'ti-camera-off'
    );

    return;

  }


  var active =
    running;


  if(active){

    await stopScanner();

  }


  cameraIndex =
    (
      cameraIndex + 1
    ) %
    cameras.length;


  if(active){

    setTimeout(
      startScanner,
      100
    );

  }else{

    setStatus(
      'Kamera dipilih. Tekan Mulai Scanner.',
      null,
      'ti-camera'
    );

  }

}


/* =========================================================
   COPY
========================================================= */

copyButton.onclick =
  async function(){

    var value =
      resultValue
        .textContent
        .trim();


    if(!value){
      return;
    }


    try{

      await navigator
        .clipboard
        .writeText(
          value
        );


      setStatus(
        'Nomor rekening berhasil disalin.',
        'success',
        'ti-copy'
      );


    }catch(_){

      setStatus(
        'Nomor rekening: '+
        value,
        'success',
        'ti-info-circle'
      );

    }

  };


/* =========================================================
   SCAN AGAIN
========================================================= */

scanAgainButton.onclick =
  function(){

    result.classList.remove(
      'show'
    );

    lastAccount =
      '';

    lastTime =
      0;

    idle.classList.remove(
      'hidden'
    );

    setStatus(
      'Tekan Mulai Scanner untuk scan kembali.',
      null,
      'ti-scan'
    );

    updateButtons();

  };


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.onclick =
  startScanner;


retryButton.onclick =
  async function(){

    await stopScanner();

    result.classList.remove(
      'show'
    );

    lastAccount =
      '';

    lastTime =
      0;

    setTimeout(
      startScanner,
      100
    );

  };


switchButton.onclick =
  switchCamera;


stopButton.onclick =
  async function(){

    await stopScanner();

    result.classList.remove(
      'show'
    );

    setStatus(
      'Scanner dihentikan.',
      null,
      'ti-camera-off'
    );

  };


/* =========================================================
   PAGE EVENTS
========================================================= */

window.addEventListener(
  'pagehide',
  function(){

    stopScanner();

  }
);


window.addEventListener(
  'beforeunload',
  function(){

    stopScanner();

  }
);


/* =========================================================
   INITIAL
========================================================= */

if(
  typeof Html5Qrcode ===
    'undefined'
){

  setStatus(
    'Library scanner belum tersedia.',
    'error',
    'ti-alert-circle'
  );

}else{

  setStatus(
    'Scanner siap.',
    null,
    'ti-scan'
  );

}


getCameras();

updateButtons();


})();

</script>

</html>
