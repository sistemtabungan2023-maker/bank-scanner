<!doctype html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#07111f"
>

<title>Bank Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  width:100%;
  height:100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#07111f;
  color:#fff;

  overflow:hidden;
}

body{
  min-height:100vh;
  min-height:100dvh;
}


/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100%;

  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  background:#07111f;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  height:64px;

  flex:0 0 64px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    10px
    14px;

  background:
    rgba(
      7,
      17,
      31,
      .96
    );

  border-bottom:
    1px
    solid
    rgba(
      255,
      255,
      255,
      .08
    );
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:40px;
  height:40px;

  border-radius:12px;

  display:grid;
  place-items:center;

  background:#155eef;

  font-size:18px;
  font-weight:700;
}

.brand-text strong{
  display:block;

  font-size:14px;
}

.brand-text span{
  display:block;

  margin-top:2px;

  font-size:9px;

  color:
    rgba(
      255,
      255,
      255,
      .55
    );
}

.status{
  display:flex;

  align-items:center;

  gap:7px;

  font-size:9px;

  color:
    rgba(
      255,
      255,
      255,
      .65
    );
}

.status-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0
    0
    12px
    rgba(
      34,
      197,
      94,
      .8
    );
}


/* =========================================================
   MAIN
========================================================= */

.scanner-wrap{
  flex:1;

  min-height:0;

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:14px;

  overflow:hidden;
}

.scanner-card{
  width:
    min(
      560px,
      100%
    );

  max-height:100%;

  display:flex;

  flex-direction:column;

  gap:11px;

  min-height:0;
}


/* =========================================================
   TITLE
========================================================= */

.scanner-title{
  text-align:center;

  flex:0 0 auto;
}

.scanner-title h1{
  margin:0;

  font-size:22px;

  line-height:1.2;
}

.scanner-title p{
  margin:
    6px
    auto
    0;

  max-width:430px;

  font-size:10px;

  line-height:1.5;

  color:
    rgba(
      255,
      255,
      255,
      .55
    );
}


/* =========================================================
   CAMERA VIEW
========================================================= */

.viewport{

  position:relative;

  width:100%;

  /*
   * Tinggi mengikuti ruang yang tersedia.
   * Tidak lagi memaksa seluruh halaman scanner.
   */
  height:
    min(
      560px,
      calc(
        100vh - 250px
      )
    );

  min-height:300px;

  flex:1 1 auto;

  background:#000;

  border-radius:22px;

  overflow:hidden;

  box-shadow:
    0
    22px
    60px
    rgba(
      0,
      0,
      0,
      .35
    );
}


/* html5-qrcode */

#reader{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  background:#000;

  z-index:1;
}

#reader video{
  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  display:block!important;

  border:0!important;
}

#reader__dashboard{
  display:none!important;
}

#reader__scan_region{
  width:100%!important;
  height:100%!important;

  min-height:100%!important;

  background:#000!important;

  border:0!important;
}

#reader__scan_region img{
  display:none!important;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay{
  position:absolute;

  inset:0;

  z-index:5;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.30),
      rgba(0,0,0,.02) 30%,
      rgba(0,0,0,.02) 70%,
      rgba(0,0,0,.30)
    );
}


/* =========================================================
   SCAN AREA
========================================================= */

.scan-area{

  position:absolute;

  left:18%;
  right:18%;

  top:20%;
  bottom:20%;

  z-index:8;

  border:
    2px
    solid
    rgba(
      255,
      255,
      255,
      .92
    );

  border-radius:22px;

  box-shadow:
    0
    0
    0
    9999px
    rgba(
      0,
      0,
      0,
      .22
    ),

    0
    0
    30px
    rgba(
      21,
      94,
      239,
      .30
    );

  pointer-events:none;
}


/* =========================================================
   CORNERS
========================================================= */

.corner{
  position:absolute;

  width:42px;
  height:42px;

  z-index:9;

  pointer-events:none;
}

.corner.tl{
  left:-2px;
  top:-2px;

  border-left:
    5px
    solid
    #fff;

  border-top:
    5px
    solid
    #fff;

  border-radius:
    12px
    0
    0
    0;
}

.corner.tr{
  right:-2px;
  top:-2px;

  border-right:
    5px
    solid
    #fff;

  border-top:
    5px
    solid
    #fff;

  border-radius:
    0
    12px
    0
    0;
}

.corner.bl{
  left:-2px;
  bottom:-2px;

  border-left:
    5px
    solid
    #fff;

  border-bottom:
    5px
    solid
    #fff;

  border-radius:
    0
    0
    0
    12px;
}

.corner.br{
  right:-2px;
  bottom:-2px;

  border-right:
    5px
    solid
    #fff;

  border-bottom:
    5px
    solid
    #fff;

  border-radius:
    0
    0
    12px
    0;
}


/* =========================================================
   SCAN LINE
========================================================= */

.scan-line{

  position:absolute;

  left:18%;
  right:18%;

  top:50%;

  height:3px;

  z-index:10;

  border-radius:99px;

  background:#3b82f6;

  box-shadow:
    0
    0
    8px
    rgba(
      59,
      130,
      246,
      .9
    ),

    0
    0
    18px
    rgba(
      59,
      130,
      246,
      .8
    );

  animation:
    scanLine
    2s
    ease-in-out
    infinite;

  pointer-events:none;
}

@keyframes scanLine{

  0%,
  100%{
    transform:
      translateY(-90px);
  }

  50%{
    transform:
      translateY(90px);
  }

}


/* =========================================================
   IDLE
========================================================= */

.idle{

  position:absolute;

  inset:0;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:25px;

  background:
    radial-gradient(
      circle at center,
      rgba(
        21,
        94,
        239,
        .16
      ),
      rgba(
        7,
        17,
        31,
        .94
      )
    );
}

.idle-box{
  text-align:center;

  max-width:330px;
}

.idle-icon{

  width:66px;
  height:66px;

  margin:
    0
    auto
    13px;

  border-radius:20px;

  display:grid;
  place-items:center;

  background:
    rgba(
      255,
      255,
      255,
      .08
    );

  border:
    1px
    solid
    rgba(
      255,
      255,
      255,
      .08
    );

  font-size:27px;
}

.idle-box strong{
  display:block;

  font-size:15px;
}

.idle-box span{

  display:block;

  margin-top:7px;

  font-size:10px;

  line-height:1.6;

  color:
    rgba(
      255,
      255,
      255,
      .55
    );
}


/* =========================================================
   STATUS
========================================================= */

.status-box{

  min-height:42px;

  flex:0 0 auto;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:
    8px
    12px;

  border-radius:12px;

  background:
    rgba(
      255,
      255,
      255,
      .06
    );

  border:
    1px
    solid
    rgba(
      255,
      255,
      255,
      .07
    );

  font-size:10px;

  line-height:1.5;

  color:
    rgba(
      255,
      255,
      255,
      .75
    );
}

.status-box.error{

  color:#fecaca;

  background:
    rgba(
      127,
      29,
      29,
      .28
    );

  border-color:
    rgba(
      248,
      113,
      113,
      .25
    );
}

.status-box.success{

  color:#bbf7d0;

  background:
    rgba(
      20,
      83,
      45,
      .35
    );

  border-color:
    rgba(
      74,
      222,
      128,
      .25
    );
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

  flex:0 0 auto;

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;
}

button{

  min-height:44px;

  border:0;

  border-radius:12px;

  padding:
    8px
    12px;

  font:
    inherit;

  font-size:10px;

  font-weight:700;

  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.primary{
  background:#155eef;
  color:#fff;
}

.secondary{
  background:#fff;
  color:#182033;
}

.danger{
  background:#991b1b;
  color:#fff;
}


/* =========================================================
   RESULT
========================================================= */

.result-card{

  display:none;

  flex:0 0 auto;

  padding:13px;

  border-radius:14px;

  background:#fff;

  color:#182033;
}

.result-card.show{
  display:block;
}

.result-label{

  font-size:8px;

  font-weight:700;

  letter-spacing:.12em;

  color:#7c8798;
}

.result-value{

  margin-top:6px;

  font-size:19px;

  font-weight:700;

  word-break:break-all;
}

.result-actions{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:7px;

  margin-top:10px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  flex:0 0 auto;

  padding:
    3px
    10px
    8px;

  text-align:center;

  font-size:7px;

  line-height:1.4;

  color:
    rgba(
      255,
      255,
      255,
      .30
    );
}


/* =========================================================
   EMBEDDED MODE
   INI BAGIAN PALING PENTING
========================================================= */

/* =========================================================
   EMBEDDED MODE - SCANNER DI DALAM IFRAME
========================================================= */

body.embedded{
  width:100%;
  height:100%;
  min-height:100dvh;

  overflow:hidden;

  background:#07111f;
}

body.embedded .app{
  width:100%;
  height:100%;
  min-height:100dvh;

  display:block;

  overflow:hidden;
}

body.embedded .topbar{
  display:none !important;
}

body.embedded .scanner-wrap{
  width:100%;
  height:100%;
  min-height:100dvh;

  padding:0 !important;

  display:block;

  overflow:hidden;
}

body.embedded .scanner-card{
  width:100%;
  height:100%;
  max-width:none;
  max-height:none;

  display:block;

  position:relative;

  overflow:hidden;
}

body.embedded .scanner-title{
  display:none !important;
}


/* =========================================================
   CAMERA
========================================================= */

body.embedded .viewport{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  min-height:100%;

  border-radius:0;

  overflow:hidden;

  background:#000;
}

body.embedded #reader{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  z-index:1;
}

body.embedded #reader video{
  width:100% !important;
  height:100% !important;

  object-fit:cover !important;
}


/* =========================================================
   QR FRAME
========================================================= */

body.embedded .scan-area{

  position:absolute;

  left:17%;
  right:17%;

  top:23%;
  bottom:28%;

  z-index:8;

  border:
    2px
    solid
    rgba(
      255,
      255,
      255,
      .95
    );

  border-radius:22px;

  box-shadow:
    0
    0
    0
    9999px
    rgba(
      0,
      0,
      0,
      .18
    );

  pointer-events:none;
}

body.embedded .scan-line{
  left:17%;
  right:17%;

  z-index:9;
}


/* =========================================================
   IDLE
========================================================= */

body.embedded .idle{
  z-index:20;

  background:
    radial-gradient(
      circle at center,
      rgba(
        21,
        94,
        239,
        .12
      ),
      rgba(
        7,
        17,
        31,
        .78
      )
    );
}


/* =========================================================
   STATUS
========================================================= */

body.embedded .status-box{

  position:absolute;

  left:10px;
  right:10px;

  bottom:132px;

  z-index:40;

  min-height:38px;

  padding:7px 10px;

  background:
    rgba(
      7,
      17,
      31,
      .82
    );

  border:
    1px
    solid
    rgba(
      255,
      255,
      255,
      .14
    );

  color:#fff;

  backdrop-filter:blur(10px);

  border-radius:12px;

  text-align:center;
}


/* =========================================================
   BUTTON AREA
========================================================= */

body.embedded .controls{

  position:absolute;

  left:10px;
  right:10px;

  z-index:50;

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin:0;

  padding:0;
}


/*
 * BARIS PERTAMA
 * Mulai Scanner + Ganti Kamera
 */
body.embedded .controls:nth-of-type(1){

  top:auto;

  bottom:70px;
}


/*
 * BARIS KEDUA
 * Tutup + Coba Lagi
 */
body.embedded .controls:nth-of-type(2){

  top:auto;

  bottom:12px;
}


/* tombol */
body.embedded .controls button{

  min-height:48px;

  border-radius:13px;

  box-shadow:
    0
    6px
    18px
    rgba(
      0,
      0,
      0,
      .25
    );
}


/* =========================================================
   RESULT
========================================================= */

body.embedded .result-card{

  position:absolute;

  left:12px;
  right:12px;

  top:50%;

  transform:
    translateY(-50%);

  z-index:100;

  box-shadow:
    0
    18px
    50px
    rgba(
      0,
      0,
      0,
      .4
    );
}


/* =========================================================
   FOOTER
========================================================= */

body.embedded .footer{
  display:none !important;
}


/* =========================================================
   DESKTOP EMBEDDED
========================================================= */

@media(min-width:701px){

  body.embedded .scan-area{

    left:25%;
    right:25%;

    top:20%;
    bottom:27%;

  }

  body.embedded .scan-line{

    left:25%;
    right:25%;

  }

}


/* =========================================================
   MOBILE EMBEDDED
========================================================= */

@media(max-width:700px){

  body.embedded .scan-area{

    left:14%;
    right:14%;

    top:20%;
    bottom:30%;

    border-radius:19px;

  }

  body.embedded .scan-line{

    left:14%;
    right:14%;

  }

  body.embedded .status-box{

    left:8px;
    right:8px;

    bottom:126px;

    font-size:9px;

  }

  body.embedded .controls{

    left:8px;
    right:8px;

    gap:6px;

  }

  body.embedded .controls:nth-of-type(1){

    bottom:65px;

  }

  body.embedded .controls:nth-of-type(2){

    bottom:8px;

  }

  body.embedded .controls button{

    min-height:46px;

    font-size:10px;

  }

}


/* =========================================================
   HP KECIL
========================================================= */

@media(max-width:420px){

  body.embedded .scan-area{

    left:13%;
    right:13%;

    top:19%;
    bottom:31%;

  }

  body.embedded .status-box{

    bottom:120px;

    font-size:8px;

  }

  body.embedded .controls{

    left:6px;
    right:6px;

  }

  body.embedded .controls:nth-of-type(1){

    bottom:62px;

  }

  body.embedded .controls:nth-of-type(2){

    bottom:6px;

  }

}


/* =========================================================
   MOBILE NORMAL
========================================================= */

@media(max-width:700px){

  .topbar{
    min-height:58px;
    height:58px;
    flex-basis:58px;
  }

  .brand-icon{
    width:35px;
    height:35px;
  }

  .brand-text strong{
    font-size:13px;
  }

  .brand-text span{
    font-size:8px;
  }

  .status{
    display:none;
  }

  .scanner-wrap{
    padding:8px;
  }

  .scanner-title h1{
    font-size:19px;
  }

  .viewport{
    height:
      min(
        500px,
        calc(
          100dvh - 250px
        )
      );

    min-height:300px;

    border-radius:16px;
  }

  .scan-area{
    left:15%;
    right:15%;

    top:19%;
    bottom:19%;
  }

  .scan-line{
    left:15%;
    right:15%;
  }

  .corner{
    width:36px;
    height:36px;
  }

}


/* =========================================================
   MOBILE EMBEDDED
========================================================= */

@media(max-width:700px){

  body.embedded .viewport{

    width:100%;
    height:100%;

    min-height:100dvh;

    border-radius:0;
  }

  body.embedded .scan-area{

    left:16%;
    right:16%;

    top:25%;
    bottom:25%;

    border-radius:20px;
  }

  body.embedded .scan-line{

    left:16%;
    right:16%;

    animation-duration:2.2s;
  }

  body.embedded .controls{

    left:8px;
    right:8px;

    top:8px;

    gap:7px;
  }

  body.embedded .controls:nth-of-type(2){

    bottom:48px;
  }

  body.embedded .status-box{

    left:8px;
    right:8px;

    bottom:8px;
  }

}


/* =========================================================
   VERY SMALL
========================================================= */

@media(max-width:420px){

  .scanner-wrap{
    padding:6px;
  }

  .viewport{
    min-height:280px;
  }

  .scan-area{
    left:14%;
    right:14%;
  }

  .scan-line{
    left:14%;
    right:14%;
  }

}

</style>

</head>


<body>

<div class="app">

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">
        QR
      </div>

      <div class="brand-text">

        <strong>
          BANK SCANNER
        </strong>

        <span>
          Live QR Account Scanner
        </span>

      </div>

    </div>


    <div class="status">

      <span class="status-dot"></span>

      <span>
        Scanner
      </span>

    </div>

  </header>


  <main class="scanner-wrap">

    <section class="scanner-card">


      <div class="scanner-title">

        <h1>
          Scan QR Rekening
        </h1>

        <p>
          Arahkan kamera belakang HP
          ke QR rekening.
        </p>

      </div>


      <div class="viewport">


        <div id="reader"></div>


        <div
          id="idle"
          class="idle"
        >

          <div class="idle-box">

            <div class="idle-icon">
              ⌗
            </div>

            <strong>
              Scanner Siap
            </strong>

            <span>
              Tekan "Mulai Scanner"
              untuk membuka kamera.
            </span>

          </div>

        </div>


        <div class="overlay"></div>


        <div class="scan-area">

          <div class="corner tl"></div>

          <div class="corner tr"></div>

          <div class="corner bl"></div>

          <div class="corner br"></div>

        </div>


        <div class="scan-line"></div>


      </div>


      <div
        id="status"
        class="status-box"
      >
        Scanner siap.
      </div>


      <div class="controls">

        <button
          id="startButton"
          class="primary"
          type="button"
        >
          📷 Mulai Scanner
        </button>


        <button
          id="switchButton"
          class="secondary"
          type="button"
        >
          🔄 Ganti Kamera
        </button>

      </div>


      <div class="controls">

        <button
          id="stopButton"
          class="danger"
          type="button"
        >
          ⛔ Tutup Scanner
        </button>


        <button
          id="retryButton"
          class="secondary"
          type="button"
        >
          ↻ Coba Lagi
        </button>

      </div>


      <div
        id="resultCard"
        class="result-card"
      >

        <div class="result-label">
          HASIL QR
        </div>


        <div
          id="resultValue"
          class="result-value"
        >
          -
        </div>


        <div class="result-actions">

          <button
            id="copyButton"
            class="primary"
            type="button"
          >
            Salin
          </button>


          <button
            id="scanAgainButton"
            class="secondary"
            type="button"
          >
            Scan Lagi
          </button>

        </div>

      </div>


      <div class="footer">
        BANK NASABAH • Live QR Scanner • HTTPS
      </div>

    </section>

  </main>

</div>


<script>

(function(){

'use strict';


/* =========================================================
   EMBEDDED DETECTION
========================================================= */

var params=
  new URLSearchParams(
    window.location.search
  );


var embedded=
  params.get('embedded')==='1';


if(embedded){

  document.body.classList.add(
    'embedded'
  );

}


/* =========================================================
   ELEMENTS
========================================================= */

var readerElement=
  document.getElementById(
    'reader'
  );


var idle=
  document.getElementById(
    'idle'
  );


var statusBox=
  document.getElementById(
    'status'
  );


var startButton=
  document.getElementById(
    'startButton'
  );


var switchButton=
  document.getElementById(
    'switchButton'
  );


var stopButton=
  document.getElementById(
    'stopButton'
  );


var retryButton=
  document.getElementById(
    'retryButton'
  );


var resultCard=
  document.getElementById(
    'resultCard'
  );


var resultValue=
  document.getElementById(
    'resultValue'
  );


var copyButton=
  document.getElementById(
    'copyButton'
  );


var scanAgainButton=
  document.getElementById(
    'scanAgainButton'
  );


var scanner=
  null;


var running=
  false;


var starting=
  false;


var cameras=
  [];


var cameraIndex=
  0;


var lastValue=
  '';


var lastTime=
  0;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type
){

  statusBox.textContent=
    message;

  statusBox.className=
    'status-box';

  if(type){

    statusBox.classList.add(
      type
    );

  }

}


/* =========================================================
   BUTTONS
========================================================= */

function updateButtons(){

  startButton.disabled=
    running ||
    starting;

  stopButton.disabled=
    !running;

  switchButton.disabled=
    starting;

}


/* =========================================================
   PARSE QR
========================================================= */

function parseAccount(
  raw
){

  var value=
    String(
      raw||''
    ).trim();


  var parts=
    value.split('|');


  if(
    parts.length>=3 &&
    (
      parts[0]==='BANKNASABAH' ||
      parts[0]==='BANKAPP'
    ) &&
    parts[1]==='REK'
  ){

    value=
      parts[2].trim();

  }


  value=
    value.replace(
      /[^\d]/g,
      ''
    );


  return /^\d+$/.test(
    value
  )
    ? value
    : '';

}


/* =========================================================
   SEND RESULT
========================================================= */

function sendResult(
  account
){

  var message={

    type:
      'BANK_SCANNER_RESULT',

    account:
      account,

    value:
      account

  };


  try{

    if(
      window.parent &&
      window.parent!==window
    ){

      window.parent.postMessage(
        message,
        '*'
      );

    }

  }catch(_){}


  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(
        message,
        '*'
      );

    }

  }catch(_){}


  try{

    if(
      'BroadcastChannel'
      in window
    ){

      var channel=
        new BroadcastChannel(
          'BANK_NASABAH_SCANNER'
        );


      channel.postMessage(
        message
      );


      channel.close();

    }

  }catch(_){}

}


/* =========================================================
   HANDLE SCAN
========================================================= */

function handleScan(
  decodedText
){

  var account=
    parseAccount(
      decodedText
    );


  if(!account){

    setStatus(
      'QR terbaca tetapi bukan QR rekening Bank Nasabah.',
      'error'
    );

    return;

  }


  var now=
    Date.now();


  if(
    account===
      lastValue &&
    now-lastTime<2500
  ){

    return;

  }


  lastValue=
    account;

  lastTime=
    now;


  resultValue.textContent=
    account;


  resultCard.classList.add(
    'show'
  );


  setStatus(
    'QR berhasil dibaca: '+
    account,
    'success'
  );


  sendResult(
    account
  );


  stopScanner();


  updateButtons();

}


/* =========================================================
   CAMERA LIST
========================================================= */

async function getCameras(){

  try{

    cameras=
      (
        await navigator
          .mediaDevices
          .enumerateDevices()
      )
      .filter(
        function(device){

          return device.kind===
            'videoinput';

        }
      );

  }catch(error){

    console.error(error);

    cameras=[];

  }

}


function chooseRearCamera(){

  var index=
    cameras.findIndex(
      function(device){

        return /back|rear|environment/i
          .test(
            device.label||''
          );

      }
    );


  if(index>=0){

    cameraIndex=
      index;

  }

}


/* =========================================================
   START
========================================================= */

async function startScanner(){

  if(
    starting ||
    running
  ){

    return;

  }


  if(
    typeof Html5Qrcode===
    'undefined'
  ){

    setStatus(
      'Library scanner belum dimuat. Muat ulang halaman GitHub Pages.',
      'error'
    );

    return;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    setStatus(
      'Browser tidak mendukung kamera live.',
      'error'
    );

    return;

  }


  if(
    location.protocol!=='https:' &&
    location.hostname!=='localhost' &&
    location.hostname!=='127.0.0.1'
  ){

    setStatus(
      'Scanner harus dibuka melalui HTTPS.',
      'error'
    );

    return;

  }


  starting=
    true;


  updateButtons();


  resultCard.classList.remove(
    'show'
  );


  setStatus(
    'Meminta izin kamera...',
    null
  );


  try{

    /*
     * Permission.
     */

    var permissionStream=
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:
                'environment'
            }
          },

          audio:false

        });


    permissionStream
      .getTracks()
      .forEach(
        function(track){

          try{

            track.stop();

          }catch(_){}

        }
      );


    await getCameras();


    chooseRearCamera();


    if(scanner){

      try{
        await scanner.stop();
      }catch(_){}

      try{
        await scanner.clear();
      }catch(_){}

    }


    scanner=
      new Html5Qrcode(
        'reader'
      );


    var camera;


    if(
      cameras[cameraIndex] &&
      cameras[cameraIndex].deviceId
    ){

      camera=
        cameras[
          cameraIndex
        ].deviceId;

    }else{

      camera={
        facingMode:{
          ideal:
            'environment'
        }
      };

    }


    idle.classList.add(
      'hidden'
    );


    var width=
      window.innerWidth||
      640;


    var qrSize=
      embedded
        ? Math.max(
            190,
            Math.min(
              280,
              Math.floor(
                width*.62
              )
            )
          )
        : Math.max(
            210,
            Math.min(
              300,
              Math.floor(
                width*.62
              )
            )
          );


    await scanner.start(

      camera,

      {
        fps:10,

        qrbox:{
          width:qrSize,
          height:qrSize
        },

        aspectRatio:1,

        disableFlip:false

      },

      function(decodedText){

        handleScan(
          decodedText
        );

      },

      function(errorMessage){

        /*
         * Normal decode error.
         */

      }

    );


    running=
      true;

    starting=
      false;


    setStatus(
      'Kamera LIVE aktif. Arahkan QR ke kotak.',
      null
    );


    updateButtons();


  }catch(error){

    console.error(
      'SCANNER ERROR:',
      error
    );


    starting=
      false;

    running=
      false;


    try{

      if(scanner){

        await scanner.stop();

      }

    }catch(_){}


    try{

      if(scanner){

        await scanner.clear();

      }

    }catch(_){}


    scanner=
      null;


    idle.classList.remove(
      'hidden'
    );


    var name=
      error &&
      error.name
        ? error.name
        : '';


    if(
      name==='NotAllowedError'||
      name==='PermissionDeniedError'
    ){

      setStatus(
        'Kamera diblokir browser. Izinkan kamera untuk halaman ini lalu tekan Coba Lagi.',
        'error'
      );

    }else if(
      name==='NotFoundError'
    ){

      setStatus(
        'Kamera tidak ditemukan pada perangkat.',
        'error'
      );

    }else if(
      name==='NotReadableError'
    ){

      setStatus(
        'Kamera sedang digunakan aplikasi lain.',
        'error'
      );

    }else if(
      name==='SecurityError'
    ){

      setStatus(
        'Akses kamera diblokir browser. Pastikan HTTPS aktif.',
        'error'
      );

    }else{

      setStatus(
        error &&
        error.message
          ? error.message
          : 'Scanner gagal dibuka.',
        'error'
      );

    }


    updateButtons();

  }

}


/* =========================================================
   STOP
========================================================= */

async function stopScanner(){

  running=
    false;


  if(scanner){

    try{

      await scanner.stop();

    }catch(_){}


    try{

      await scanner.clear();

    }catch(_){}

  }


  scanner=
    null;


  idle.classList.remove(
    'hidden'
  );


  updateButtons();

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera(){

  await getCameras();


  if(
    cameras.length<2
  ){

    setStatus(
      'Perangkat hanya memiliki satu kamera.',
      'error'
    );

    return;

  }


  var wasRunning=
    running;


  if(wasRunning){

    await stopScanner();

  }


  cameraIndex=
    (
      cameraIndex+1
    )%
    cameras.length;


  if(wasRunning){

    setTimeout(
      startScanner,
      100
    );

  }else{

    setStatus(
      'Kamera dipilih. Tekan Mulai Scanner.',
      null
    );

  }

}


/* =========================================================
   COPY
========================================================= */

copyButton.onclick=
  async function(){

    var value=
      resultValue
        .textContent
        .trim();


    if(!value){
      return;
    }


    try{

      await navigator
        .clipboard
        .writeText(
          value
        );


      setStatus(
        'Nomor rekening berhasil disalin.',
        'success'
      );


    }catch(_){

      setStatus(
        'Nomor rekening: '+
        value,
        'success'
      );

    }

  };


/* =========================================================
   SCAN AGAIN
========================================================= */

scanAgainButton.onclick=
  function(){

    resultCard.classList.remove(
      'show'
    );

    lastValue=
      '';

    lastTime=
      0;

    idle.classList.remove(
      'hidden'
    );

    setStatus(
      'Tekan Mulai Scanner untuk scan kembali.',
      null
    );

    updateButtons();

  };


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.onclick=
  startScanner;


retryButton.onclick=
  async function(){

    await stopScanner();

    lastValue=
      '';

    lastTime=
      0;

    resultCard.classList.remove(
      'show'
    );

    setTimeout(
      startScanner,
      120
    );

  };


switchButton.onclick=
  switchCamera;


stopButton.onclick=
  async function(){

    await stopScanner();

    resultCard.classList.remove(
      'show'
    );

    setStatus(
      'Scanner dihentikan.',
      null
    );

  };


/* =========================================================
   PAGE EVENTS
========================================================= */

window.addEventListener(
  'pagehide',
  function(){

    stopScanner();

  }
);


window.addEventListener(
  'beforeunload',
  function(){

    stopScanner();

  }
);


document.addEventListener(
  'visibilitychange',
  function(){

    if(
      document.hidden &&
      running
    ){

      stopScanner();

      setStatus(
        'Scanner dihentikan karena halaman tidak aktif.',
        null
      );

    }

  }
);


/* =========================================================
   INIT
========================================================= */

if(
  typeof Html5Qrcode===
  'undefined'
){

  setStatus(
    'Library scanner gagal dimuat. Muat ulang halaman.',
    'error'
  );

}else{

  setStatus(
    'Scanner siap. Tekan Mulai Scanner.',
    null
  );

}


getCameras();

updateButtons();


})();

</script>

</body>
</html>
